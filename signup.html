<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — PriceHunt® Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="background-color: var(--bg-canvas);">

  <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem;">
    
    <a href="index.html" class="nav-brand" style="font-size: 2.2rem; margin-bottom: 2rem;">
      pricehunt<span class="sup">®</span>
    </a>

    <div style="background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: var(--radius-card); box-shadow: var(--shadow-card); width: 100%; max-width: 420px; padding: 36px;">
      
      <h2 style="font-size: 24px; font-weight: 700; color: var(--text-pure); margin-bottom: 6px;">Create Account</h2>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 24px;">Start comparing products with zero cost.</p>

      <div id="alertBox" class="alert-box"></div>

      <form id="signupForm">
        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; font-weight: 700;">FULL NAME</label>
          <input type="text" id="name" class="dark-select" placeholder="Alex Johnson" required style="width: 100%; background: #110d24; border: 1px solid var(--border-dark); border-radius: var(--radius-pill); padding: 10px 16px; color: var(--text-pure);">
        </div>

        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; font-weight: 700;">EMAIL</label>
          <input type="email" id="email" class="dark-select" placeholder="alex@example.com" required style="width: 100%; background: #110d24; border: 1px solid var(--border-dark); border-radius: var(--radius-pill); padding: 10px 16px; color: var(--text-pure);">
        </div>

        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; font-weight: 700;">PASSWORD</label>
          <input type="password" id="password" class="dark-select" placeholder="Min. 6 characters" required minlength="6" style="width: 100%; background: #110d24; border: 1px solid var(--border-dark); border-radius: var(--radius-pill); padding: 10px 16px; color: var(--text-pure);">
        </div>

        <div style="margin-bottom: 24px;">
          <label style="display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; font-weight: 700;">CONFIRM PASSWORD</label>
          <input type="password" id="confirmPassword" class="dark-select" placeholder="Repeat password" required minlength="6" style="width: 100%; background: #110d24; border: 1px solid var(--border-dark); border-radius: var(--radius-pill); padding: 10px 16px; color: var(--text-pure);">
        </div>

        <button type="submit" id="submitBtn" class="btn-hunt-now" style="width: 100%; padding: 12px; font-size: 14px; justify-content: center;">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
        Already registered? <a href="login.html" style="color: var(--accent-lavender); font-weight: 600;">Sign In</a>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
