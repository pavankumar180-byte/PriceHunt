<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Password — PriceHunt</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🎯</div>
        Price<span>Hunt</span>
      </a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Set New Password</h1>
        <p>Please enter a strong password for your account.</p>
      </div>

      <div id="alertBox" class="alert-box"></div>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-control" placeholder="Min. 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" class="form-control" placeholder="Re-enter new password" required minlength="6">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
          Reset Password
        </button>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
