<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Wishlist — PriceHunt® Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="page-canvas">
    
    <!-- Top Header -->
    <header class="fabrid-nav">
      <a href="index.html" class="nav-brand">
        pricehunt<span class="sup">®</span>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html">Shop</a></li>
        <li><a href="search.html">Categories</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="favorites.html" class="active">Wishlist</a></li>
        <li><a href="alerts.html">Alerts</a></li>
      </ul>

      <div class="nav-right-actions">
        <a href="profile.html" class="nav-icon-btn">👤</a>
        <a href="search.html" class="btn-hunt-now"><span>•</span> Hunt Now</a>
      </div>
    </header>

    <main class="container" style="padding: 3rem 1.5rem;">
      <div class="section-header-row">
        <div>
          <h2>My Saved Wishlist</h2>
          <p>Track live price movements across your saved items.</p>
        </div>
        <a href="search.html" class="btn-hunt-now">+ Add More</a>
      </div>

      <div class="hot-picks-grid" id="favoritesGrid"></div>
    </main>

    <!-- Clean Dark Footer -->
    <footer class="fabrid-footer">
      <div class="container footer-bottom-bar">
        <div>&copy; 2026 PriceHunt® Store. All rights reserved.</div>
        <div>Luxury Dark E-Commerce Architecture</div>
      </div>
    </footer>

  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('favoritesGrid');
      try {
        const favs = await Api.request('/favorites');
        if (!favs || favs.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem 1rem; background: var(--bg-card); border-radius: var(--radius-card); border: 1px solid var(--border-dark);">
              <div style="font-size: 2.5rem; margin-bottom: 1rem;">🤍</div>
              <h4 style="font-weight: 700; font-size: 18px; color: var(--text-pure); margin-bottom: 0.5rem;">Your wishlist is empty</h4>
              <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 1.5rem;">Save items while browsing to track price drops.</p>
              <a href="search.html" class="btn-hunt-now">Discover Deals</a>
            </div>
          `;
          return;
        }

        grid.innerHTML = favs.map(f => {
          const p = f.product;
          return `
            <div class="hot-product-card">
              <div class="hot-card-head">
                <span class="tag-new">${p.brand}</span>
                <span class="price-tag">₹${(p.minPrice || 63999).toLocaleString('en-IN')}</span>
              </div>
              <div class="hot-card-img-wrap">
                <img src="${p.imageUrl}" alt="${p.name}">
                <a href="product.html?id=${p.id}" class="hot-card-pill-btn">• Compare</a>
              </div>
              <div class="hot-card-body">
                <div class="hot-card-title">${p.name}</div>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        console.warn(e);
      }
    });
  </script>
</body>
</html>
