<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Alerts — PriceHunt® Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="page-canvas">
    
    <!-- Top Header -->
    <header class="fabrid-nav">
      <a href="index.html" class="nav-brand">
        pricehunt<span class="sup">®</span>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html">Shop</a></li>
        <li><a href="search.html">Categories</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="favorites.html">Wishlist</a></li>
        <li><a href="alerts.html" class="active">Alerts</a></li>
      </ul>

      <div class="nav-right-actions">
        <a href="profile.html" class="nav-icon-btn">👤</a>
        <a href="search.html" class="btn-hunt-now"><span>•</span> Hunt Now</a>
      </div>
    </header>

    <main class="container" style="padding: 3rem 1.5rem;">
      <div class="section-header-row">
        <div>
          <h2>Active Price Drop Alerts</h2>
          <p>Instant notification triggers when prices reach your budget threshold.</p>
        </div>
      </div>

      <div id="alertsContainer" style="display: flex; flex-direction: column; gap: 16px;"></div>
    </main>

    <!-- Clean Dark Footer -->
    <footer class="fabrid-footer">
      <div class="container footer-bottom-bar">
        <div>&copy; 2026 PriceHunt® Store. All rights reserved.</div>
        <div>Luxury Dark E-Commerce Architecture</div>
      </div>
    </footer>

  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('alertsContainer');
      try {
        const alerts = await Api.request('/alerts');
        if (!alerts || alerts.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 4rem 1rem; background: var(--bg-card); border-radius: var(--radius-card); border: 1px solid var(--border-dark);">
              <div style="font-size: 2.5rem; margin-bottom: 1rem;">🔔</div>
              <h4 style="font-weight: 700; font-size: 18px; color: var(--text-pure); margin-bottom: 0.5rem;">No active price alerts</h4>
              <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 1.5rem;">Set a target budget on any product to track it automatically.</p>
              <a href="search.html" class="btn-hunt-now">Find Items to Track</a>
            </div>
          `;
          return;
        }

        container.innerHTML = alerts.map(a => `
          <div style="background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 16px;">
              <img src="${a.product.imageUrl}" alt="${a.product.name}" style="width: 56px; height: 56px; object-fit: contain; border-radius: var(--radius-inner); background: rgba(255, 255, 255, 0.03); padding: 4px;">
              <div>
                <h4 style="font-size: 16px; font-weight: 700; color: var(--text-pure);">${a.product.name}</h4>
                <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
                  Target: <strong style="color: var(--accent-lavender);">₹${a.targetPrice.toLocaleString('en-IN')}</strong> • Status: <span style="background: rgba(124, 58, 237, 0.2); color: var(--accent-lavender); padding: 2px 8px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600;">Active</span>
                </div>
              </div>
            </div>

            <div style="display: flex; gap: 10px;">
              <a href="product.html?id=${a.product.id}" class="btn-hunt-now" style="font-size: 12px; padding: 6px 14px; background: rgba(255, 255, 255, 0.1); box-shadow: none;">Compare Rates</a>
              <button class="btn-hunt-now" style="font-size: 12px; padding: 6px 14px; background: rgba(239, 68, 68, 0.2); color: #f87171; box-shadow: none;" onclick="deleteAlert(${a.id})">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.warn(e);
      }
    });

    async function deleteAlert(id) {
      if (confirm('Delete this price alert?')) {
        await Api.request(`/alerts/${id}`, { method: 'DELETE' });
        window.location.reload();
      }
    }
  </script>
</body>
</html>
