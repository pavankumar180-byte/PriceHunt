# ============================================================================
# PRICEHUNT SPRING BOOT APPLICATION CONFIGURATION
# ============================================================================

server.port=8080
server.servlet.context-path=/

# Database Configuration (Defaults to persistent local file DB; override with MySQL if running)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pricehunt;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (For development & inspectability)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security Settings
pricehunt.jwt.secret=9a3f2c4e6b8a1d0f5e7c3b9a2d4f6e8a1c0b3d5e7f9a2b4c6d8e0f1a3b5c7d9e
pricehunt.jwt.expiration-ms=86400000

# CORS Configuration
pricehunt.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:8080,http://127.0.0.1:8080

# Marketplace API Integration Credentials & Configuration
# Amazon India (Official Creators / Product Advertising API)
pricehunt.marketplace.amazon.enabled=${AMAZON_INTEGRATION_ENABLED:true}
pricehunt.marketplace.amazon.access-key=${AMAZON_ACCESS_KEY:}
pricehunt.marketplace.amazon.secret-key=${AMAZON_SECRET_KEY:}
pricehunt.marketplace.amazon.associate-tag=${AMAZON_ASSOCIATE_TAG:}
pricehunt.marketplace.amazon.region=${AMAZON_REGION:eu-west-1}
pricehunt.marketplace.amazon.host=${AMAZON_HOST:webservices.amazon.in}

# Flipkart Developer / Affiliate API
pricehunt.marketplace.flipkart.enabled=${FLIPKART_INTEGRATION_ENABLED:true}
pricehunt.marketplace.flipkart.affiliate-id=${FLIPKART_AFFILIATE_ID:}
pricehunt.marketplace.flipkart.affiliate-token=${FLIPKART_AFFILIATE_TOKEN:}
pricehunt.marketplace.flipkart.base-url=${FLIPKART_BASE_URL:https://affiliate-api.flipkart.net/affiliate/1.0}

# Croma & Reliance Digital Integrations
pricehunt.marketplace.croma.enabled=${CROMA_INTEGRATION_ENABLED:true}
pricehunt.marketplace.reliance.enabled=${RELIANCE_INTEGRATION_ENABLED:true}

# Scheduled Automated Monitoring
pricehunt.tracking.scheduled-cron=0 0 2 * * ?
pricehunt.tracking.interval-ms=86400000

# Logging
logging.level.com.pricehunt=INFO
logging.level.org.springframework.security=WARN
