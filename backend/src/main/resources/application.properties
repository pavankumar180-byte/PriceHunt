# ============================================================================
# PRICEHUNT SPRING BOOT APPLICATION CONFIGURATION
# ============================================================================

server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration (Set your local credentials if using MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/pricehunt_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Settings
pricehunt.jwt.secret=9a3f2c4e6b8a1d0f5e7c3b9a2d4f6e8a1c0b3d5e7f9a2b4c6d8e0f1a3b5c7d9e
pricehunt.jwt.expiration-ms=86400000

# CORS Configuration
pricehunt.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8080,http://localhost:8080

# Logging
logging.level.com.pricehunt=INFO
logging.level.org.springframework.security=WARN
