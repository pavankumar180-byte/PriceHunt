<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — NovaTrend</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="background-color: var(--bg-secondary);">

  <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem;">
    
    <a href="index.html" class="nav-brand" style="font-size: 2rem; margin-bottom: 2rem;">
      NovaTrend
    </a>

    <div style="background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); width: 100%; max-width: 420px; padding: 2.5rem;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <h2 style="font-size: 22px; font-weight: 800; color: var(--text-main);">Welcome Back</h2>
        <button type="button" class="theme-toggle-btn" title="Toggle Dark/Light Mode" style="width: 32px; height: 32px; font-size: 14px;">☀️</button>
      </div>
      <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 1.5rem;">Sign in to access your saved deals and price alerts.</p>

      <div id="alertBox" class="alert-box"></div>

      <form id="loginForm">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; font-weight: 700;">EMAIL ADDRESS</label>
          <input type="email" id="email" class="catalog-select" placeholder="name@example.com" value="demo@pricehunt.com" required style="width: 100%; padding: 11px 14px;">
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; font-weight: 700;">PASSWORD</label>
          <input type="password" id="password" class="catalog-select" placeholder="••••••••" value="password123" required style="width: 100%; padding: 11px 14px;">
        </div>

        <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 13px; color: var(--text-secondary);">
        Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 600;">Create Account</a>
      </div>

    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
