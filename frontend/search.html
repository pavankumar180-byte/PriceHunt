<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Deals — PriceHunt</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    .shop-search-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      padding: 2.5rem 0;
    }
    .shop-filter-panel {
      background: var(--pure-white);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-elevated-card);
      padding: 24px;
      height: fit-content;
      position: sticky;
      top: 24px;
    }
    .filter-item {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--faint-border);
    }
    .filter-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .filter-label {
      font-size: 12px;
      color: var(--muted-gray);
      margin-bottom: 8px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: -0.017em;
    }
    .shop-select {
      width: 100%;
      border-radius: var(--radius-pill);
      border: 1px solid var(--faint-border);
      padding: 8px 14px;
      font-size: 14px;
      background: var(--pure-white);
      color: var(--ink-black);
      outline: none;
    }
    @media (max-width: 900px) {
      .shop-search-layout {
        grid-template-columns: 1fr;
      }
      .shop-filter-panel {
        position: static;
      }
    }
  </style>
</head>
<body>

  <!-- Top App Download Banner -->
  <aside class="app-download-banner">
    <span>📱 Download PriceHunt app • Available on iOS & Android</span>
  </aside>

  <div class="app-shell">
    
    <!-- Persistent Sidebar Nav Rail -->
    <aside class="sidebar-rail">
      <div>
        <a href="index.html" class="nav-rail-logo">PH<span style="color: var(--shop-violet);">.</span></a>
        <ul class="nav-rail-items">
          <li><a href="index.html" class="nav-rail-btn" title="Home">🏠</a></li>
          <li><a href="search.html" class="nav-rail-btn active" title="Search">🔍</a></li>
          <li><a href="dashboard.html" class="nav-rail-btn" title="Dashboard">⚡</a></li>
          <li><a href="favorites.html" class="nav-rail-btn" title="Wishlist">🤍</a></li>
          <li><a href="alerts.html" class="nav-rail-btn" title="Alerts">🔔</a></li>
        </ul>
      </div>
      <div>
        <a href="profile.html" class="nav-rail-avatar">👤</a>
      </div>
    </aside>

    <!-- Main Viewport -->
    <main class="main-viewport">
      
      <!-- Top Search Bar Header -->
      <div style="background-color: var(--pure-white); border-bottom: 1px solid var(--faint-border); padding: 1.5rem 0;">
        <div class="container">
          <form class="search-form search-pill-container" style="max-width: 700px; margin: 0 auto;">
            <input type="text" id="searchQueryInput" class="search-pill-input" name="q" placeholder="Search across all platforms...">
            <button type="submit" class="search-violet-submit" title="Search">➔</button>
          </form>
        </div>
      </div>

      <div class="container shop-search-layout">
        
        <!-- Filter Panel -->
        <aside class="shop-filter-panel">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;">
            <div style="font-size: 16px; font-weight: 500; letter-spacing: -0.031em;">Filters</div>
            <button class="pill-btn pill-btn-white" style="padding: 4px 10px; font-size: 11px;" onclick="resetFilters()">Reset</button>
          </div>

          <div class="filter-item">
            <div class="filter-label">Category</div>
            <select id="categoryFilter" class="shop-select">
              <option value="">All Categories</option>
            </select>
          </div>

          <div class="filter-item">
            <div class="filter-label">Brand</div>
            <select id="brandFilter" class="shop-select">
              <option value="">All Brands</option>
            </select>
          </div>

          <div class="filter-item">
            <div class="filter-label" style="display: flex; justify-content: space-between;">
              <span>Max Price</span>
              <span id="priceDisplay" style="color: var(--shop-violet); font-weight: 600;">₹2,50,000</span>
            </div>
            <input type="range" id="priceRange" min="10000" max="250000" step="5000" value="250000" style="width: 100%; accent-color: var(--shop-violet); cursor: pointer;">
          </div>
        </aside>

        <!-- Product Grid Results -->
        <section>
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
            <div>
              <div style="font-size: 20px; font-weight: 500; letter-spacing: -0.05em;">
                Results for <span id="queryDisplay" style="color: var(--shop-violet);">All Products</span>
              </div>
              <small style="color: var(--muted-gray); font-size: 12px;"><span id="resultCount">0</span> items available</small>
            </div>

            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 12px; color: var(--muted-gray);">Sort:</span>
              <select id="sortBy" class="shop-select" style="width: auto;">
                <option value="best_deal">⚡ Best Deal Score</option>
                <option value="price_asc">💰 Lowest Price</option>
                <option value="price_desc">💵 Highest Price</option>
                <option value="rating_desc">★ Highest Rated</option>
                <option value="discount_desc">🏷️ Highest Discount</option>
              </select>
            </div>
          </div>

          <div class="shop-grid-3" id="searchResultsGrid">
            <!-- Dynamic 28px Shop Cards -->
          </div>
        </section>

      </div>

      <footer class="shop-footer">
        <div class="container" style="font-size: 11px; text-align: center; color: var(--cool-stone);">
          &copy; 2026 PriceHunt. Pillow-soft shopping discovery.
        </div>
      </footer>

    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
