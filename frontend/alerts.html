<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Alerts — PriceHunt</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top App Download Banner -->
  <aside class="app-download-banner">
    <span>📱 Download PriceHunt app • Available on iOS & Android</span>
  </aside>

  <div class="app-shell">
    
    <!-- Persistent Sidebar Nav Rail -->
    <aside class="sidebar-rail">
      <div>
        <a href="index.html" class="nav-rail-logo">PH<span style="color: var(--shop-violet);">.</span></a>
        <ul class="nav-rail-items">
          <li><a href="index.html" class="nav-rail-btn" title="Home">🏠</a></li>
          <li><a href="search.html" class="nav-rail-btn" title="Search">🔍</a></li>
          <li><a href="dashboard.html" class="nav-rail-btn" title="Dashboard">⚡</a></li>
          <li><a href="favorites.html" class="nav-rail-btn" title="Wishlist">🤍</a></li>
          <li><a href="alerts.html" class="nav-rail-btn active" title="Alerts">🔔</a></li>
        </ul>
      </div>
      <div>
        <a href="profile.html" class="nav-rail-avatar">👤</a>
      </div>
    </aside>

    <!-- Main Viewport -->
    <main class="main-viewport">
      <div class="container" style="padding: 3rem 1.5rem;">
        
        <div style="margin-bottom: 2rem;">
          <h1 style="font-size: 24px; font-weight: 500; letter-spacing: -0.05em;">Active Price Drop Triggers</h1>
          <p style="color: var(--muted-gray); font-size: 14px;">Instant alerts when prices drop to your target threshold.</p>
        </div>

        <div id="alertsContainer" style="display: flex; flex-direction: column; gap: 16px;"></div>

      </div>

      <footer class="shop-footer">
        <div class="container" style="font-size: 11px; text-align: center; color: var(--cool-stone);">
          &copy; 2026 PriceHunt. Pillow-soft shopping discovery.
        </div>
      </footer>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('alertsContainer');
      try {
        const alerts = await Api.request('/alerts');
        if (!alerts || alerts.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 4rem 1rem; background: white; border-radius: var(--radius-card); box-shadow: var(--shadow-elevated-card);">
              <div style="font-size: 2.5rem; margin-bottom: 1rem;">🔔</div>
              <h4 style="font-weight: 500; font-size: 18px; margin-bottom: 0.5rem;">No active alerts</h4>
              <p style="color: var(--muted-gray); font-size: 14px; margin-bottom: 1.5rem;">Set a target price on any product to track it automatically.</p>
              <a href="search.html" class="pill-btn pill-btn-violet">Discover Items</a>
            </div>
          `;
          return;
        }

        container.innerHTML = alerts.map(a => `
          <div style="background: var(--pure-white); border-radius: var(--radius-card); box-shadow: var(--shadow-elevated-card); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 16px;">
              <img src="${a.product.imageUrl}" alt="${a.product.name}" style="width: 52px; height: 52px; object-fit: contain; border-radius: var(--radius-inner); background: #fafafa; padding: 4px;">
              <div>
                <h4 style="font-size: 16px; font-weight: 500; letter-spacing: -0.031em;">${a.product.name}</h4>
                <div style="font-size: 13px; color: var(--muted-gray); margin-top: 2px;">
                  Target: <strong style="color: var(--shop-violet);">₹${a.targetPrice.toLocaleString('en-IN')}</strong> • Status: <span style="background: #f6f5ff; color: var(--shop-violet); padding: 2px 8px; border-radius: var(--radius-pill); font-size: 11px;">Active</span>
                </div>
              </div>
            </div>

            <div style="display: flex; gap: 8px;">
              <a href="product.html?id=${a.product.id}" class="pill-btn pill-btn-white" style="font-size: 12px; padding: 6px 14px;">View Comparisons</a>
              <button class="pill-btn pill-btn-white" style="font-size: 12px; padding: 6px 14px; color: #ef4444;" onclick="deleteAlert(${a.id})">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.warn(e);
      }
    });

    async function deleteAlert(id) {
      if (confirm('Delete this price alert?')) {
        await Api.request(`/alerts/${id}`, { method: 'DELETE' });
        window.location.reload();
      }
    }
  </script>
</body>
</html>
