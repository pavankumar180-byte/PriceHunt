<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — PriceHunt</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🎯</div>
        Price<span>Hunt</span>
      </a>
      <a href="login.html" class="btn btn-secondary btn-sm">Back to Login</a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Reset Your Password</h1>
        <p>Enter your registered email and we'll dispatch a secure recovery link.</p>
      </div>

      <div id="alertBox" class="alert-box"></div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label class="form-label" for="email">Registered Email</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
          Send Reset Link
        </button>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
